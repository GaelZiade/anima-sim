<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anima Sim</title>
  <link rel="stylesheet" href="./estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>Anima Sim</h1>
    <p>Simulador de combate para Anima: Beyond Fantasy. Todo corre en tu navegador: las planillas no salen de tu computadora.</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="t-fichas">
      <h2 id="t-fichas">Fichas</h2>
      <label class="zona" id="zona">
        <input type="file" id="archivos" multiple accept=".xlsx,.xlsm,.json" hidden>
        <strong>Arrastrá planillas acá</strong>
        <span>o hacé clic para elegirlas · .xlsx, .xlsm, un escenario .json o una lista de fichas .json</span>
      </label>
      <p class="aviso" id="aviso" hidden></p>
      <ul class="biblioteca" id="biblioteca"></ul>
    </section>

    <section class="panel" aria-labelledby="t-combate">
      <h2 id="t-combate">Combate</h2>
      <div class="equipos">
        <div class="equipo" data-equipo="A">
          <h3><span class="marca a"></span>Equipo A</h3>
          <ul id="equipoA"></ul>
        </div>
        <div class="equipo" data-equipo="B">
          <h3><span class="marca b"></span>Equipo B</h3>
          <ul id="equipoB"></ul>
        </div>
      </div>

      <details class="opciones" open>
        <summary>Opciones</summary>
        <div class="rejilla">
          <label>Combates <input type="number" id="combates" min="1" step="1000" value="10000"></label>
          <label>Hilos <input type="number" id="hilos" min="1" max="64" value="4"></label>
          <label>Distancia inicial (m) <input type="number" id="distancia" min="0" value="10"></label>
          <label>Semilla <input type="number" id="semilla" min="1" value="1"></label>
          <label>Fase lunar
            <select id="faseLunar">
              <option value="">De día</option>
              <option value="llena">Llena</option>
              <option value="creciente">Creciente</option>
              <option value="menguante">Menguante</option>
              <option value="nueva">Nueva</option>
              <option value="eclipse">Eclipse</option>
            </select>
            <small id="notaLuna" class="nota">Sólo con el Legado de la Luna</small>
          </label>
        </div>
        <div class="casillas">
          <label><input type="checkbox" id="rotura"> Rotura de armas y armaduras</label>
          <label><input type="checkbox" id="huida"> Se puede huir</label>
          <label><input type="checkbox" id="espacioReducido"> Espacio reducido</label>
          <label><input type="checkbox" id="armasEnfundadas"> Armas enfundadas</label>
        </div>
      </details>

      <div class="acciones">
        <button type="button" id="simular" class="principal">Simular</button>
        <button type="button" id="cancelar" hidden>Cancelar</button>
        <button type="button" id="narrar">Narrar un combate</button>
      </div>
      <div class="progreso" id="progreso" hidden><div id="barraProgreso"></div></div>
    </section>

    <section class="panel" id="resultados" aria-labelledby="t-resultados" hidden>
      <h2 id="t-resultados">Resultados</h2>
      <div class="victorias" id="victorias"></div>
      <p class="resumen" id="resumen"></p>
      <div class="tabla"><table id="tabla"></table></div>
    </section>

    <section class="panel" id="narracion" aria-labelledby="t-narracion" hidden>
      <h2 id="t-narracion">Narración</h2>
      <div id="registro" class="registro"></div>
    </section>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
